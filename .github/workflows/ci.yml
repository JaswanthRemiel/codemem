name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      npm_config_fetch_retries: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The packed tarball must install and run with the npm that ships with each Node.js
      # version, the way `npx codemem` would for a user. No lockfile is involved on this path.
      # Installs download a few hundred megabytes; retry once so a dropped connection on a
      # runner does not fail the job, and publish the error if both attempts fail.
      - name: Install without scripts
        shell: bash
        run: |
          npm ci --ignore-scripts > "$RUNNER_TEMP/install.log" 2>&1 || (sleep 20 && npm ci --ignore-scripts > "$RUNNER_TEMP/install.log" 2>&1) || {
            cat "$RUNNER_TEMP/install.log"
            echo "::error title=npm ci failed::$(tail -c 3000 "$RUNNER_TEMP/install.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - run: npm pack
      - name: Run the packed tarball with the bundled npm
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/packtest"
          cp codemem-*.tgz "$RUNNER_TEMP/packtest/codemem.tgz"
          cd "$RUNNER_TEMP/packtest"
          printf 'export function helloWorld() {\n  return 1;\n}\n' > a.ts
          # On failure the end of the output becomes an annotation, which can be read
          # without signing in to GitHub.
          if ! {
            npm --version &&
            npx --yes ./codemem.tgz --version &&
            npx --yes ./codemem.tgz doctor &&
            npx --yes ./codemem.tgz index &&
            npx --yes ./codemem.tgz search helloWorld | grep 'function helloWorld'
          } > "$RUNNER_TEMP/pack.log" 2>&1; then
            cat "$RUNNER_TEMP/pack.log"
            echo "::error title=Packed tarball failed::$(tail -c 3000 "$RUNNER_TEMP/pack.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat "$RUNNER_TEMP/pack.log"
      # npm 10 (bundled with Node 22) carries a node-gyp too old to find Visual Studio on the
      # Windows runner, and lockfile installs run node-gyp for better-sqlite3.
      - run: npm install -g npm@11
      - name: Install
        shell: bash
        run: |
          npm ci > "$RUNNER_TEMP/install.log" 2>&1 || (sleep 20 && npm ci > "$RUNNER_TEMP/install.log" 2>&1) || {
            cat "$RUNNER_TEMP/install.log"
            echo "::error title=npm ci failed::$(tail -c 3000 "$RUNNER_TEMP/install.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:chars
      # The hybrid search tests use the real local embedding model (about 23 MB).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/codemem
          key: embedding-model-all-MiniLM-L6-v2-q8
      - run: npm run coverage
      - run: npx . --version
