name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The packed tarball must install and run with the npm that ships with each Node.js
      # version, the way `npx codemem` would for a user. No lockfile is involved on this path.
      - run: npm ci --ignore-scripts
      - run: npm pack
      - name: Run the packed tarball with the bundled npm
        shell: bash
        run: |
          npm --version
          mkdir "$RUNNER_TEMP/packtest"
          cp codemem-*.tgz "$RUNNER_TEMP/packtest/codemem.tgz"
          cd "$RUNNER_TEMP/packtest"
          printf 'export function helloWorld() {\n  return 1;\n}\n' > a.ts
          npx --yes ./codemem.tgz --version
          npx --yes ./codemem.tgz doctor
          npx --yes ./codemem.tgz index
          npx --yes ./codemem.tgz search helloWorld | grep 'function helloWorld'
      # npm 10 (bundled with Node 22) carries a node-gyp too old to find Visual Studio on the
      # Windows runner, and lockfile installs run node-gyp for better-sqlite3.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:chars
      # The hybrid search tests use the real local embedding model (about 23 MB).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/codemem
          key: embedding-model-all-MiniLM-L6-v2-q8
      - run: npm run coverage
      - run: npx . --version
