name: Website

# Builds the documentation site in web-app/. It is a separate project with its own
# dependencies, so it only runs when the site changes, and the CLI's CI never installs it.
on:
  push:
    branches: [main]
    paths: ['web-app/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web-app/**', '.github/workflows/web.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
